# =============================================================================
# Production Docker Compose Architecture
# Complete containerized multi-tier ecosystem with health checks and restart policies
# =============================================================================

services:
  # 1. Reverse Proxy & Gateway
  gateway:
    image: nginx:alpine
    container_name: event-platform-gateway
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      api:
        condition: service_healthy
      consumer-web:
        condition: service_started
    networks:
      - event-network

  # 2. Central Backend API (Modular Monolith)
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    container_name: event-platform-api
    restart: always
    environment:
      - NODE_ENV=production
      - PORT=4000
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=redis://redis:6379
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - RAZORPAY_KEY_ID=${RAZORPAY_KEY_ID}
      - RAZORPAY_KEY_SECRET=${RAZORPAY_KEY_SECRET}
      - RAZORPAY_WEBHOOK_SECRET=${RAZORPAY_WEBHOOK_SECRET}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:3000,http://localhost:3001,http://localhost:3002}
    ports:
      - "4000:4000"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:4000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - event-network

  # 3. Redis Cache & Concurrency Distributed Lock
  redis:
    image: redis:7-alpine
    container_name: event-platform-redis
    restart: always
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis_prod_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - event-network

  # 4. Consumer Web Portal
  consumer-web:
    build:
      context: .
      dockerfile: docker/Dockerfile.web
      args:
        APP_NAME: consumer-web
    container_name: event-platform-consumer-web
    restart: always
    environment:
      - NODE_ENV=production
      - PORT=3000
      - NEXT_PUBLIC_API_BASE_URL=http://api:4000
      - NEXT_PUBLIC_SUPABASE_URL=${SUPABASE_URL}
      - NEXT_PUBLIC_SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}
    networks:
      - event-network

  # 5. Organizer Web Portal
  organizer-web:
    build:
      context: .
      dockerfile: docker/Dockerfile.web
      args:
        APP_NAME: organizer-web
    container_name: event-platform-organizer-web
    restart: always
    environment:
      - NODE_ENV=production
      - PORT=3001
      - NEXT_PUBLIC_API_BASE_URL=http://api:4000
      - NEXT_PUBLIC_SUPABASE_URL=${SUPABASE_URL}
      - NEXT_PUBLIC_SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}
    networks:
      - event-network

  # 6. Admin Web Portal
  admin-web:
    build:
      context: .
      dockerfile: docker/Dockerfile.web
      args:
        APP_NAME: admin-web
    container_name: event-platform-admin-web
    restart: always
    environment:
      - NODE_ENV=production
      - PORT=3002
      - NEXT_PUBLIC_API_BASE_URL=http://api:4000
      - NEXT_PUBLIC_SUPABASE_URL=${SUPABASE_URL}
      - NEXT_PUBLIC_SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}
    networks:
      - event-network

volumes:
  redis_prod_data:

networks:
  event-network:
    driver: bridge
