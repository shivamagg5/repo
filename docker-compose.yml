services:
  redis:
    image: redis:7-alpine
    container_name: event-platform-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  # Uncomment to use a local PostgreSQL instead of Supabase for development
