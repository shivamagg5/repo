    startCommand: pnpm --filter consumer-web start
    envVars:
      - key: NODE_VERSION
        value: "22.14.0"
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_API_URL
        value: https://event-platform-api-r4og.onrender.com/api/v1
      - key: NEXT_PUBLIC_SUPABASE_URL
        value: https://bthpeqgafgxomaqhjfrc.supabase.co
      - key: NEXT_PUBLIC_SUPABASE_ANON_KEY
        value: sb_publishable_n8txh3BqiMKQXt9KM1AnXQ_Re4yr4Fl

