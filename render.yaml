services:
  # =============================================================================
  # 1. Central Backend NestJS API
  # =============================================================================
  - type: web
    name: event-platform-api
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install -g pnpm@10.13.1 && pnpm install --frozen-lockfile && pnpm --filter @platform/types build && pnpm --filter @platform/validation build && pnpm --filter @platform/config build && pnpm --filter @platform/api build
    startCommand: node backend/api/dist/main
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_VERSION
        value: "22.14.0"
      - key: NODE_ENV
        value: production
      - key: SUPABASE_URL
        value: https://bthpeqgafgxomaqhjfrc.supabase.co
      - key: SUPABASE_ANON_KEY
        value: sb_publishable_n8txh3BqiMKQXt9KM1AnXQ_Re4yr4Fl
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        value: "*"

  # =============================================================================
  # 2. Consumer Web — Landing Page & Event Discovery (Next.js)
  # =============================================================================
  - type: web
    name: event-platform-consumer
    runtime: node
    plan: free
    region: oregon
